apiVersion: v1
kind: Service
metadata:
  name: {{ template "bk-hcm.fullname" . }}-iacserver
  labels:
    {{- include "common.labels.standard" . | nindent 4 }}
spec:
  type: {{ .Values.iacserver.service.type }}
  ports:
    {{- with .Values.iacserver.service.ports }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  selector:
    {{- include "common.labels.matchLabels" . | nindent 4 }}
    component: iacserver
