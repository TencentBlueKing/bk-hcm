# defines all the network related options.
network:
  # bindIP is ip where server working on.
  bindIP:
  # port is port where server listen to http port.
  port: 9601
  # defines tls related options.
  tls:
    # server should be accessed without verifying the TLS certificate.
    insecureSkipVerify: 
    # server requires TLS client certificate authentication.
    certFile:
    # server requires TLS client certificate authentication.
    keyFile:
    # trusted root certificates for server.
    caFile:
    # the password to decrypt the certificate.
    password:

# defines service related settings.
service:
  # defines etcd related settings
  etcd:
    # endpoints is a list of URLs.
    endpoints:
      - 127.0.0.1:2379
    # dialTimeoutMS is the timeout milliseconds for failing to establish a connection.
    dialTimeoutMS:
    # username is a user's name for authentication.
    username:
    # password is a password for authentication.
    password:
    # defines tls related options.
    tls:
      # server should be accessed without verifying the TLS certificate.
      insecureSkipVerify:
      # server requires TLS client certificate authentication.
      certFile:
      # server requires TLS client certificate authentication.
      keyFile:
      # trusted root certificates for server.
      caFile:
      # the password to decrypt the certificate.
      password:

# defines log's related configuration
log:
  # log storage directory.
  logDir: ./log
  # per file max size, uint: MB.
  maxPerFileSizeMB: 1024
  # per line max size, uint: KB.
  maxPerLineSizeKB: 2
  # log file max storage number.
  maxFileNum: 5
  # whether the restart service log is appended to the latest log file, or whether a new log file is created.
  logAppend: false
  # log the log to std err only, it can not be used with AlsoToStdErr at the same time.
  toStdErr: false
  # log the log to file and also to std err. it can not be used with ToStdErr at the same time.
  alsoToStdErr: false
  # log level.
  verbosity: 0
sync:
  # resource synchronization concurrent config,
  # rule syntax: vendor/resource/region, use '*' to match any.
  # rules are matched from top to bottom, if matched, the rule will be used immediately.
  # exact match rule should be placed at the top of wildcard rules.
  # 资源同步并发配置，规则语法：vendor/resource/region，支持使用字符`*`表示通配某个字段
  # 规则自上而下匹配，会使用第一条匹配到规则，因此精确匹配的规则应该放在通配规则前面
  concurrentRules:
    - rule: tcloud/load_balancer/*
      syncConcurrent: 1
      listConcurrent: 1
  # if no any rule matched, use this default config
  defaultConcurrent: 1

# defines cmdb api gateway related settings.
cmdb:
  # endpoints is a seed list of host:port addresses of cmdb api gateway nodes.
  endpoints:
    - http://demo.com
  # appCode is the BlueKing app code of hcm to request cmdb api gateway.
  appCode:
  # appSecret is the BlueKing app secret of hcm to request cmdb api gateway.
  appSecret:
  # user is the BlueKing user of hcm to request cmdb api gateway.
  user: admin
  # bkTicket is the BlueKing access ticket of hcm to request cmdb api gateway.
  bkTicket:
  # bkToken is the BlueKing access token of hcm to request cmdb api gateway.
  bkToken:
  # defines tls related options.
  tls:
    # server should be accessed without verifying the TLS certificate.
    insecureSkipVerify:
    # server requires TLS client certificate authentication.
    certFile:
    # server requires TLS client certificate authentication.
    keyFile:
    # trusted root certificates for server.
    caFile:
    # the password to decrypt the certificate.
    password:

# terraform provider plugin process.
tfPlugin:
  # PLUGIN_MIN_PORT. The unix socket data path does not use this range.
  minPort: 40000
  # PLUGIN_MAX_PORT. One range only; it must not contain network.port.
  maxPort: 40999
  # Timeout for one plugin gRPC health check. Empty means 3s.
  healthCheckTimeout: 3s

# ccHostPoolBiz cmdb host pool biz id
ccHostPoolBiz: 1

# defines iac plugin related settings.
iacPlugin:
  # lockLeaseSeconds is the lease ttl of the plugin lock held during register/upgrade, in seconds.
  # it must be greater than the longest time one registration takes.
  lockLeaseSeconds: 600
  # lockWaitTimeoutSeconds is the longest time to wait for the plugin lock, in seconds.
  lockWaitTimeoutSeconds: 120
  # tf defines tf_provider iac plugin related settings.
  tf:
    # pluginDir is the root directory of the tf_provider plugins,
    # layout: {pluginDir}/{plugin name}/{version}/{os}_{arch}/{executable}.
    # NOTE: restart hc-service after changing the contents of this directory.
    pluginDir: /data/hcm/plugins
    # versionCheckIntervalSeconds is the interval of the runtime version check, in seconds.
    versionCheckIntervalSeconds: 60
    # versionCheckThreshold is the consecutive times of version behind before exiting.
    versionCheckThreshold: 3
  # http defines http iac plugin related settings.
  http:
    # enabled turns http iac plugin on. set to false if no http plugin is used, tf_provider plugins are not affected.
    enabled: false
    # probeTimeoutSeconds is the timeout of probing a http plugin, in seconds.
    probeTimeoutSeconds: 10
    # checkIntervalSeconds is the interval of the http plugin inspection, in seconds. only the master inspects.
    checkIntervalSeconds: 60
    # checkFailureThreshold is the consecutive probe failures before an enabled http plugin is set to failed.
    checkFailureThreshold: 5
    # gateway defines the BlueKing api gateway used to access http iac plugins.
    gateway:
      # endpoints is the api gateway environment address prefix, exactly one address is allowed,
      # {plugin_name} will be replaced with the plugin name.
      endpoints:
        - https://{plugin_name}.apigw.example.com/prod
      # appCode is the BlueKing app code of hcm to request api gateway.
      appCode:
      # appSecret is the BlueKing app secret of hcm to request api gateway.
      appSecret:
      # user is the BlueKing user of hcm to request api gateway.
      user: admin
      # defines tls related options.
      tls:
        # server should be accessed without verifying the TLS certificate.
        insecureSkipVerify:
        # server requires TLS client certificate authentication.
        certFile:
        # server requires TLS client certificate authentication.
        keyFile:
        # trusted root certificates for server.
        caFile:
        # the password to decrypt the certificate.
        password:

